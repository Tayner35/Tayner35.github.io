<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Interactive Airway and PFT Curve Model</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#172033}
    body{display:grid;place-items:center}
    main{max-width:38rem;padding:2rem;text-align:center}
    p{color:#5f6b7a}
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <h1>Loading interactive PFT model…</h1>
    <p>The model is being prepared in your browser.</p>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      if(!('DecompressionStream' in window)) throw new Error('This browser does not support the decompression feature required to open the model. Use a current version of Safari, Chrome, Edge, or Firefox.');
      const paths=["payload/00.txt?v=f94908453df8c", "payload/00b0.txt?v=f94908453df8c", "payload/00b1.txt?v=f94908453df8c", "payload/00b2.txt?v=f94908453df8c", "payload/00b3.txt?v=f94908453df8c", "payload/01.txt?v=f94908453df8c", "payload/01b.txt?v=f94908453df8c", "payload/02.txt?v=f94908453df8c", "payload/02b.txt?v=f94908453df8c", "payload/03.txt?v=f94908453df8c", "payload/04.txt?v=f94908453df8c", "payload/05.txt?v=f94908453df8c"];
      const encoded=(await Promise.all(paths.map(async path=>{
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok) throw new Error(`Unable to load ${path} (${response.status}).`);
        return response.text();
      }))).join('');
      const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.innerHTML='<h1>Unable to load the model</h1><p></p>';
      status.querySelector('p').textContent=error instanceof Error?error.message:String(error);
      console.error(error);
    }
  })();
  </script>
</body>
</html>
