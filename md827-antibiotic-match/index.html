<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b3f"><title>MD827 Antibiotic Match Lab</title><style>html,body{margin:0;min-height:100%;background:#0b2233;color:#effffc;font:16px system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.mark{display:grid;width:58px;height:58px;margin:0 auto 16px;place-items:center;border:1px solid #ffffff33;border-radius:16px;background:#ffffff14;color:#8ae6da;font-weight:850}p{color:#d9efecaa;max-width:40rem}</style></head><body><main id="loader"><div><span class="mark">Rx</span><strong>Antibiotic Match Lab</strong><p>Loading lecture-derived game…</p></div></main><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This game requires a current browser version.');const p=await Promise.all([...Array(6)].map(async(_,i)=>{const r=await fetch('./payload/'+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('Unable to load game data.');return r.text()}));const b=p.join('').trim(),bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loader').innerHTML='<div><span class="mark">!</span><strong>Unable to load the game</strong><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
