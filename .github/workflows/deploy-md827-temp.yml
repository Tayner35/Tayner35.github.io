name: Deploy MD827 Exam 1

on:
  push:
    branches:
      - deploy-md827-e1-6d8f2c-20260804

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy-md827-e1-6d8f2c-20260804

      - name: Install verified release bundle
        env:
          RELEASE_URL: https://at.adobe.com/24wBcEKUzrCN3ifl
          RELEASE_SHA256: 404d4ec057289e40e55ff1dc2140bbae9b1b6f6b527d9f45a3d9fbc8e109ba54
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$RELEASE_URL" -o /tmp/md827-release.zip
          echo "$RELEASE_SHA256  /tmp/md827-release.zip" | sha256sum --check --strict
          rm -rf md827-e1-6d8f2c
          mkdir -p md827-e1-6d8f2c
          unzip -q /tmp/md827-release.zip -d md827-e1-6d8f2c
          test -f md827-e1-6d8f2c/index.html
          test -f md827-e1-6d8f2c/deployment-inventory.json
          test -f md827-e1-6d8f2c/payload/chunk-003.txt

      - name: Commit deployed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md827-e1-6d8f2c
          git diff --cached --quiet && exit 0
          git commit -m "Deploy MD827 Exam 1 study platform"
          git push origin HEAD:deploy-md827-e1-6d8f2c-20260804
