name: Deploy MD827 August 4 Transcript Update

on:
  push:
    branches:
      - update-md827-aug4-transcripts-v2

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: update-md827-aug4-transcripts-v2

      - name: Install verified release bundle
        env:
          RELEASE_URL: https://at.adobe.com/QxIj4qQkQMgNMjkm
          RELEASE_SHA256: a6b35e7e6934997ba8aefeb8187f67bca52218329bacc53efc9e95a432f4277e
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$RELEASE_URL" -o /tmp/md827-release.zip
          echo "$RELEASE_SHA256  /tmp/md827-release.zip" | sha256sum --check --strict
          rm -rf md827-e1-6d8f2c
          mkdir -p md827-e1-6d8f2c
          unzip -q /tmp/md827-release.zip -d md827-e1-6d8f2c
          test -f md827-e1-6d8f2c/index.html
          test -f md827-e1-6d8f2c/deployment-inventory.json
          test -f md827-e1-6d8f2c/payload/chunk-003.txt
          grep -q '"contentVersion": "2026.08.04.2"' md827-e1-6d8f2c/deployment-inventory.json

      - name: Commit deployed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md827-e1-6d8f2c
          git diff --cached --quiet && exit 0
          git commit -m "Deploy MD827 August 4 transcript update"
          git push origin HEAD:update-md827-aug4-transcripts-v2
