name: Expand MD827 question bank through Aug 28

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/expand-md827-aug27-28.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack validated expansion tools
        shell: python
        run: |
          import base64
          import io
          import tarfile
          from pathlib import Path

          encoded = Path('md827-e3-aug24-26/expansion-tools.tar.gz.b64').read_text().strip()
          archive = base64.b64decode(encoded)
          destination = Path('/tmp/md827-expansion-tools')
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              package.extractall(destination)
          print('Unpacked:', ', '.join(sorted(path.name for path in destination.iterdir())))

      - name: Assemble and validate split question data
        shell: python
        run: |
          import base64
          import gzip
          import json
          from pathlib import Path

          root = Path('md827-e3-aug24-26')
          parts = [
              root / 'questions-aug27-28.part-1.b64',
              root / 'questions-aug27-28.part-2.b64',
          ]
          missing = [path.name for path in parts if not path.exists()]
          if missing:
              raise SystemExit(f'Missing question-data parts: {missing}')
          encoded = ''.join(path.read_text().strip() for path in parts)
          questions = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          assert len(questions) == 32
          assert questions[0]['id'] == 'PH-01'
          assert questions[-1]['id'] == 'LT-06'
          (root / 'questions-aug27-28.json.gz.b64').write_text(encoded)
          print(f'Validated {len(questions)} new questions from {len(parts)} integrity-safe parts.')

      - name: Merge, validate, and generate the 82-question build
        run: python /tmp/md827-expansion-tools/build.py

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run local desktop, mobile, filter, rationale, and migration tests
        run: |
          mkdir -p test-results
          python -m http.server 4173 >/tmp/md827-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sed -i 's#md827-e3-aug24-26/?smoke#md827-e3-aug24-26/#g' /tmp/md827-expansion-tools/local-test.js
          sed -i "s#page.locator('input\[name=\"answer\"\]\[value=\"B\"\]').check();#page.locator('[data-choice-label=\"B\"]').click();#" /tmp/md827-expansion-tools/local-test.js
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/md827-expansion-tools/local-test.js

      - name: Upload local browser-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: md827-aug24-28-browser-tests
          path: test-results/
          if-no-files-found: error

      - name: Commit expanded site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md827-e3-aug24-26/index.html \
                  md827-e3-aug24-26/payload-*.txt \
                  md827-e3-aug24-26/source-extracted.html \
                  md827-e3-aug24-26/questions-aug27-28.json \
                  md827-e3-aug24-26/questions-aug27-28.json.gz.b64 \
                  md827-e3-aug24-26/build-manifest.json
          git add -u md827-e3-aug24-26/
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Expand MD827 knowledge check through Aug 28"
            git push
          fi

      - name: Verify the public GitHub Pages deployment
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/md827-expansion-tools/live-test.js

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md827-aug24-28-live-verification
          path: test-results/live.png
          if-no-files-found: warn
