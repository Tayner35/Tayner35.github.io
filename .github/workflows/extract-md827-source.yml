name: Extract MD827 quiz source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-md827-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress current question bank
        shell: python
        run: |
          import base64
          import gzip
          from pathlib import Path

          root = Path('md827-e3-aug24-26')
          encoded = ''.join((root / f'payload-{i}.txt').read_text().strip() for i in range(1, 9))
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          (root / 'source-extracted.html').write_text(html, encoding='utf-8')
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md827-e3-aug24-26/source-extracted.html
          git diff --cached --quiet || git commit -m "Extract MD827 question bank source"
          git push
