name: Deploy MD827 August 7 Transcript Update

on:
  push:
    branches:
      - update-md827-aug7-transcripts-v1

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: update-md827-aug7-transcripts-v1

      - name: Install verified release bundle
        env:
          RELEASE_URL: https://at.adobe.com/y3isF5u84wP4qbSy
          RELEASE_SHA256: 80560139b155b70631edebb4a1dadaff00fddd2fed019a5a7f923fe615db768b
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$RELEASE_URL" -o /tmp/md827-release.zip
          echo "$RELEASE_SHA256  /tmp/md827-release.zip" | sha256sum --check --strict
          rm -rf md827-e1-6d8f2c
          mkdir -p md827-e1-6d8f2c
          unzip -q /tmp/md827-release.zip -d md827-e1-6d8f2c
          test -f md827-e1-6d8f2c/index.html
          test -f md827-e1-6d8f2c/deployment-inventory.json
          test -f md827-e1-6d8f2c/payload/chunk-017.txt
          grep -q '"contentVersion": "2026.08.07.1"' md827-e1-6d8f2c/deployment-inventory.json
          grep -q '"activityCount": 208' md827-e1-6d8f2c/deployment-inventory.json
          grep -q '"chunkCount": 18' md827-e1-6d8f2c/deployment-inventory.json
          test ! -e md827-e1-6d8f2c/patches

      - name: Commit deployed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A md827-e1-6d8f2c
          git diff --cached --quiet && exit 0
          git commit -m "Deploy MD827 August 7 transcript update"
          git push origin HEAD:update-md827-aug7-transcripts-v1
