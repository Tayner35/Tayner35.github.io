name: Deploy MD827 August 5 Transcript Update

on:
  push:
    branches:
      - update-md827-aug5-transcripts-v1

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: update-md827-aug5-transcripts-v1

      - name: Install verified release bundle
        env:
          RELEASE_URL: https://at.adobe.com/L3jChZDvN17ubRMI
          RELEASE_SHA256: 56f5c0043be618554e9521ece6702cf7d5f2798a7ce1a3c44c9a6fcd3c8457d3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$RELEASE_URL" -o /tmp/md827-release.zip
          echo "$RELEASE_SHA256  /tmp/md827-release.zip" | sha256sum --check --strict
          rm -rf md827-e1-6d8f2c
          mkdir -p md827-e1-6d8f2c
          unzip -q /tmp/md827-release.zip -d md827-e1-6d8f2c
          test -f md827-e1-6d8f2c/index.html
          test -f md827-e1-6d8f2c/deployment-inventory.json
          test -f md827-e1-6d8f2c/payload/chunk-003.txt
          grep -q '"contentVersion": "2026.08.05.1"' md827-e1-6d8f2c/deployment-inventory.json

      - name: Commit deployed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add md827-e1-6d8f2c
          git diff --cached --quiet && exit 0
          git commit -m "Deploy MD827 August 5 transcript update"
          git push origin HEAD:update-md827-aug5-transcripts-v1
