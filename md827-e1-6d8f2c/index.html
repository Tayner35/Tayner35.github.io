<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f71">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>MD827 Exam 1 Study Platform</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173042;background:#eef4f7;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e6f0f5,#f8fafb)}.loader{width:min(92vw,540px);padding:2rem;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(17,57,78,.16)}.mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#0b5c82;color:#fff;font-weight:800;font-size:1.15rem}.bar{height:10px;border-radius:999px;overflow:hidden;background:#dfe9ee;margin-top:1.25rem}.fill{height:100%;width:0;background:#0b5c82;transition:width .15s ease}.small{color:#5e7481;font-size:.9rem}.error{color:#9f2f2f;white-space:pre-wrap}@media(prefers-color-scheme:dark){:root{color:#eaf2f5;background:#0e2029}.loader{background:#142b36}.small{color:#b3c5ce}body{background:linear-gradient(135deg,#0d2029,#102b37)}}
</style>
</head>
<body>
<main class="loader" aria-live="polite">
<div class="mark">O₂</div>
<h1>Loading MD827 Exam 1</h1>
<p class="small" id="status">Preparing the validated course package…</p>
<div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
<p class="error" id="error"></p>
</main>
<script>
(async()=>{
const basePaths=["./payload/chunk-000.txt","./payload/chunk-001.txt","./payload/chunk-002.txt","./payload/chunk-003.txt"];
const patchPaths=["./patches/meta.json","./patches/respiratory-control-core.json","./patches/respiratory-control-activities.json","./patches/respiratory-stressors-core.json","./patches/respiratory-stressors-activities.json","./patches/air-quality-core.json","./patches/air-quality-activities.json"];
const status=document.getElementById('status'),fill=document.getElementById('fill');
function embeddedRange(html){const marker='const EMBEDDED_COURSE=',markerStart=html.indexOf(marker);if(markerStart<0)throw new Error('Embedded course marker not found.');const jsonStart=markerStart+marker.length;if(html[jsonStart]!=='{')throw new Error('Embedded course JSON is invalid.');let depth=0,inString=false,escaped=false;for(let i=jsonStart;i<html.length;i++){const c=html[i];if(inString){if(escaped)escaped=false;else if(c==='\\')escaped=true;else if(c==='"')inString=false;continue;}if(c==='"')inString=true;else if(c==='{')depth++;else if(c==='}'){depth--;if(depth===0)return{jsonStart,jsonEnd:i+1};}}throw new Error('Embedded course JSON is incomplete.');}
function applyPatches(bundle,patches){const meta=patches.find(p=>p.contentVersion);if(!meta)throw new Error('Course update metadata is missing.');bundle.course.contentVersion=meta.contentVersion;bundle.course.transcriptFingerprints=meta.transcriptFingerprints;bundle.course.lectures=bundle.course.lectures.map(l=>meta.courseLectures[l.id]||l);bundle.changelog=meta.changelog;for(const patch of patches){if(!patch.lectureId)continue;const i=bundle.lectures.findIndex(l=>l.id===patch.lectureId);if(i<0)throw new Error('Course update references an unknown lecture.');if(patch.fields)bundle.lectures[i]={...bundle.lectures[i],...patch.fields};if(patch.activities)bundle.lectures[i].activities=patch.activities;}return bundle;}
try{
if(!('DecompressionStream'in window))throw new Error('This study platform requires a current version of Chrome, Edge, Safari, or Firefox.');
const chunks=new Array(basePaths.length);let next=0,done=0;async function worker(){while(next<basePaths.length){const i=next++,response=await fetch(basePaths[i],{cache:'no-cache'});if(!response.ok)throw new Error('Course package request failed: '+response.status);chunks[i]=await response.text();done++;fill.style.width=Math.round(done/basePaths.length*70)+'%';status.textContent='Loading course package '+done+' of '+basePaths.length+'…';}}
await Promise.all(Array.from({length:Math.min(4,basePaths.length)},worker));
status.textContent='Applying the August 6 lecture update…';
const patches=await Promise.all(patchPaths.map(async path=>{const response=await fetch(path,{cache:'no-cache'});if(!response.ok)throw new Error('Course update request failed: '+response.status);return response.json();}));fill.style.width='85%';
const binary=atob(chunks.join('')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const range=embeddedRange(html),bundle=JSON.parse(html.slice(range.jsonStart,range.jsonEnd)),patched=applyPatches(bundle,patches);const finalHtml=html.slice(0,range.jsonStart)+JSON.stringify(patched)+html.slice(range.jsonEnd);fill.style.width='100%';status.textContent='Opening the study platform…';document.open();document.write(finalHtml);document.close();
}catch(error){document.getElementById('error').textContent='Unable to open the platform. Reload once while connected to the internet.\n\n'+error.message;status.textContent='Loading stopped.';}
})();
</script>
</body>
</html>
