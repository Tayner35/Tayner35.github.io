<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f71">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>MD827 Exam 1 Study Platform</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173042;background:#eef4f7;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e6f0f5,#f8fafb)}.loader{width:min(92vw,540px);padding:2rem;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(17,57,78,.16)}.mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#0b5c82;color:#fff;font-weight:800;font-size:1.15rem}.bar{height:10px;border-radius:999px;overflow:hidden;background:#dfe9ee;margin-top:1.25rem}.fill{height:100%;width:0;background:#0b5c82;transition:width .15s ease}.small{color:#5e7481;font-size:.9rem}.error{color:#9f2f2f;white-space:pre-wrap}@media(prefers-color-scheme:dark){:root{color:#eaf2f5;background:#0e2029}.loader{background:#142b36}.small{color:#b3c5ce}body{background:linear-gradient(135deg,#0d2029,#102b37)}}
</style>
</head>
<body>
<main class="loader" aria-live="polite">
<div class="mark">O₂</div>
<h1>Loading MD827 Exam 1</h1>
<p class="small" id="status">Preparing the validated course package…</p>
<div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
<p class="error" id="error"></p>
</main>
<script>
(async()=>{const paths=["./payload/chunk-000.txt","./payload/chunk-001.txt","./payload/chunk-002.txt","./payload/chunk-003.txt"],status=document.getElementById('status'),fill=document.getElementById('fill');try{if(!('DecompressionStream'in window))throw new Error('This study platform requires a current version of Chrome, Edge, Safari, or Firefox.');const results=new Array(paths.length);let next=0,done=0;async function worker(){while(next<paths.length){const i=next++;const response=await fetch(paths[i]);if(!response.ok)throw new Error('Course package request failed: '+response.status);results[i]=await response.text();done++;fill.style.width=Math.round(done/paths.length*100)+'%';status.textContent='Loading course package '+done+' of '+paths.length+'…';}}await Promise.all(Array.from({length:Math.min(8,paths.length)},worker));const binary=atob(results.join('')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));status.textContent='Opening the study platform…';const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(error){document.getElementById('error').textContent='Unable to open the platform. Reload once while connected to the internet.

'+error.message;status.textContent='Loading stopped.';}})();
</script>
</body>
</html>
